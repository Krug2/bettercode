services:
  relay:
    build:
      context: ..
      dockerfile: deploy/relay.Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    environment:
      RELAY_TRUST_PROXY: "true"
      RELAY_MAX_CONNECTIONS: ${RELAY_MAX_CONNECTIONS:-128}
      RELAY_MAX_PEERS: ${RELAY_MAX_PEERS:-16}
      RELAY_BYTES_PER_SECOND: ${RELAY_BYTES_PER_SECOND:-8388608}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?set RELAY_DOMAIN in deploy/relay.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/relay.env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
