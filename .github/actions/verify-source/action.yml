name: BetterC0de source verification
description: Shared desktop/mobile source, production build, and performance gate.
runs:
  using: composite
  steps:
    - name: Verify source contracts
      shell: bash
      run: npm run verify:source
    - name: Build and enforce backend startup budgets
      shell: bash
      run: |
        npm run build:backend
        npm run perf:backend
    - name: Build renderer and enforce chunk and size budgets
      shell: bash
      run: npm run build:frontend
    - name: Verify the mobile web bundle
      shell: bash
      env:
        EXPO_NO_TELEMETRY: "1"
      run: npm run export:web --workspace @betterc0de/mobile
